# Checks every pull request and every push to master: the build (which also
# validates content), the size budget, and Lighthouse CI. Required to pass
# before merge (branch ruleset on master).
#
# Security (public repo): this workflow uses `pull_request`, never
# `pull_request_target`, so pull requests from forks run with a read-only token
# and no secrets. It needs no secrets at all. Deploys happen in Cloudflare
# Workers Builds when master changes, not here.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: article contributor credits come from git log.
          fetch-depth: 0
          # The build never pushes; don't leave the token in .git/config.
          persist-credentials: false

      # package.json has no "packageManager" field, so the version is set here.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm check:budget

      # ubuntu-latest ships Chrome, which Lighthouse CI finds on its own.
      - run: pnpm check:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
